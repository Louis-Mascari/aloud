<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="600" height="500" rx="12" fill="#141418"/>

  <!-- menu bar strip -->
  <rect x="0" y="0" width="600" height="34" fill="#0d0d10"/>
  <!-- speaker glyph -->
  <g transform="translate(360,10)" fill="#eaeaf0">
    <path d="M0 5 h5 l7 -5 v14 l-7 -5 h-5 z"/>
    <path d="M15 4 a6 6 0 0 1 0 10" fill="none" stroke="#eaeaf0" stroke-width="1.6"/>
  </g>
  <!-- attention counts -->
  <g font-size="13" font-weight="600">
    <text x="392" y="22" fill="#c34043">✗1</text>
    <text x="415" y="22" fill="#e6c384">⏸1</text>
    <text x="438" y="22" fill="#76946a">✓1</text>
  </g>
  <text x="470" y="22" font-size="12" fill="#8b8b98">10:24</text>
  <text x="520" y="22" font-size="12" fill="#8b8b98" font-weight="600">Tue</text>

  <!-- dropdown panel -->
  <rect x="352" y="40" width="240" height="450" rx="10" fill="#1c1c23" stroke="#2b2b34"/>

  <g font-size="13" fill="#eaeaf0">
    <text x="368" y="64" font-size="11" fill="#8b8b98">claude-voice — auto</text>
    <line x1="360" y1="74" x2="584" y2="74" stroke="#2b2b34"/>

    <text x="368" y="94">⏹  Stop speaking</text>
    <text x="368" y="118">⤢  Jump to urgent</text>
    <text x="368" y="142">🔇  Mute (wait mode)</text>
    <line x1="360" y1="154" x2="584" y2="154" stroke="#2b2b34"/>

    <!-- pane rows -->
    <text x="368" y="176" fill="#e6c384">⏸ 14 · review the pull request  ›</text>
    <text x="368" y="200" fill="#76946a">✓ 15 · run the test suite  ›</text>
    <text x="368" y="224" fill="#c34043">✗ 16 · fix the login timeout  ›</text>
    <text x="368" y="248" fill="#7f8fa6">🔧 13 · deploy to staging  ›</text>
    <line x1="360" y1="260" x2="584" y2="260" stroke="#2b2b34"/>

    <text x="368" y="282" fill="#8b8b98">Speed  ›</text>
  </g>

  <!-- flyout: the per-pane submenu (Voice) -->
  <rect x="150" y="168" width="196" height="150" rx="10" fill="#20202a" stroke="#2b2b34"/>
  <g font-size="12.5" fill="#eaeaf0">
    <text x="164" y="188">▶  Play pending</text>
    <text x="164" y="212">↺  Replay last</text>
    <line x1="158" y1="222" x2="338" y2="222" stroke="#2b2b34"/>
    <text x="164" y="242" fill="#8b8b98">🎙 Voice</text>
    <text x="180" y="264">Heart · A</text>
    <text x="180" y="286">Bella · A-</text>
    <text x="180" y="308">Michael · C+</text>
  </g>
  <!-- pointer from pane row to flyout -->
  <path d="M352 172 L346 172" stroke="#2b2b34"/>

  <text x="20" y="470" font-size="11" fill="#6b6b78">Menu-bar transport (SwiftBar). Illustration of the rendered menu.</text>
</svg>
