<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spit It Out</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;
 --bg:#141418;--panel:#1c1c23;--panel2:#0d0d10;--edge:#2b2b34;--fg:#eaeaf0;
 --dim:#8b8b98;--accent:#3a6df0;--accent2:#4c7bf5;--hl:rgba(90,140,255,.38)}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;
 font:15px/1.5 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
#toolbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);
 border-bottom:1px solid var(--edge);flex:0 0 auto}
#toolbar .grow{flex:1}
.tbtn{font-size:13px;background:#26262e;color:var(--fg);border:0;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:#33333d}.tbtn.on{background:var(--accent)}
#hint{font-size:12px;color:var(--dim)}
#brand{font-weight:700;font-size:14px;letter-spacing:.2px;
 background:linear-gradient(90deg,var(--accent),#8a5bf0);-webkit-background-clip:text;background-clip:text;color:transparent}
#app{flex:1;display:flex;min-height:0;min-width:0}
#app.col{flex-direction:column}
#pdf{background:var(--panel2);flex:1 1 60%;min-height:0;min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
#pdfScroll{flex:1;min-height:0;overflow:auto;padding:14px;position:relative;scroll-behavior:smooth;
 display:flex;flex-direction:column;align-items:center;gap:14px}
#read{flex:1 1 40%;min-height:0;min-width:0;display:grid;grid-template-rows:1fr auto;position:relative}
.paneCtl{position:absolute;z-index:5;display:flex;gap:4px;align-items:center;background:rgba(28,28,35,.92);
 border:1px solid var(--edge);border-radius:10px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.paneCtl.br{bottom:14px;right:16px}.paneCtl.tr{top:12px;right:14px}
.paneCtl button{font-size:13px;background:#2a2a33;color:var(--fg);border:0;border-radius:7px;padding:6px 10px;cursor:pointer;line-height:1}
.paneCtl button:hover{background:#37374280}
#teleWrap{overflow:auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:22px 26px}
#controls{border-top:1px solid var(--edge);background:var(--panel);padding:14px 18px 16px;
 display:flex;flex-direction:column;align-items:center;gap:10px}
#divider{flex:0 0 10px;background:var(--edge);cursor:col-resize;position:relative}
#app.col #divider{cursor:row-resize}
#divider::after{content:"";position:absolute;inset:0;margin:auto;background:#4a4a57;border-radius:3px}
#app:not(.col) #divider::after{width:3px;height:34px}
#app.col #divider::after{height:3px;width:34px}
#divider:hover{background:var(--accent)}
.hidden{display:none!important}
.page{position:relative;box-shadow:0 2px 10px rgba(0,0,0,.55);background:#fff;flex:0 0 auto}
.page canvas{display:block}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;
 forced-color-adjust:none;transform-origin:0 0;caret-color:transparent;z-index:2}
.textLayer span{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(90,140,255,.45)}
::highlight(sentence){background:var(--hl);border-radius:3px}
.sep{width:1px;height:22px;background:var(--edge);margin:0 2px}
.zlabel{font-size:12px;color:var(--dim);margin-left:4px}
/* teleprompter */
#tele{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:52ch;width:100%}
.line{text-align:center;cursor:pointer;border-radius:8px;padding:4px 8px;transition:color .15s}
.line.ctx{font-size:calc(15px * var(--read-scale,1));color:var(--dim)}
.line.ctx:hover{color:var(--fg);background:#20202a}
.line.cur{font-size:calc(22px * var(--read-scale,1));line-height:1.5;color:var(--fg);cursor:default}
#meta{font-size:12px;color:var(--dim);margin-top:2px}
#prog{width:min(52ch,100%);height:6px;background:#26262e;border-radius:3px;cursor:pointer;overflow:hidden}
#prog>div{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .2s}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:6px}
#bar button{font-size:20px;background:#26262e;color:var(--fg);border:0;border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1}
#bar button:hover{background:#33333d}#bar button:active{transform:translateY(1px)}
#play{font-size:24px!important;background:var(--accent)!important}#play:hover{background:var(--accent2)!important}
.spd{font-size:13px!important;padding:8px 10px!important}
select#voice{font-size:13px;background:#26262e;color:var(--fg);border:0;border-radius:10px;padding:9px 10px;cursor:pointer;max-width:9rem}
</style></head>
<body>
<div id="toolbar">
 <span id="brand">Spit&nbsp;It&nbsp;Out</span>
 <span class="sep"></span>
 <button class="tbtn" id="t-orient" title="side-by-side / stacked">◧ Layout</button>
 <button class="tbtn" id="t-pdf" title="show / hide PDF">PDF</button>
 <button class="tbtn" id="t-read" title="show / hide reader">Reader</button>
 <button class="tbtn" id="t-pip" title="pop out floating controls (stay on top while you read)">⧉ Float</button>
 <span class="grow"></span>
 <span id="hint">select text on the PDF to read from there</span>
</div>
<div id="app">
 <div id="pdf">
  <div id="pdfScroll"></div>
  <div class="paneCtl br" id="pdfZoom">
   <button title="zoom out (⌘-scroll)" onclick="zoomPdf(1/1.15)">−</button>
   <button title="fit width" onclick="fitPdf()">Fit</button>
   <button title="zoom in (⌘-scroll)" onclick="zoomPdf(1.15)">+</button>
  </div>
 </div>
 <div id="divider"></div>
 <div id="read">
  <div class="paneCtl tr" id="textZoom">
   <button title="smaller text" onclick="zoomText(-1)">A−</button>
   <button title="larger text" onclick="zoomText(1)">A+</button>
  </div>
  <div id="teleWrap">
   <div id="tele">
    <div class="line ctx" id="prev"></div>
    <div class="line cur" id="cur">…</div>
    <div class="line ctx" id="next"></div>
   </div>
  </div>
  <div id="controls">
   <div id="prog"><div></div></div>
   <div id="meta"></div>
   <div id="bar">
    <button title="back a sentence" onclick="cmd('prev')">⏮</button>
    <button id="play" title="play / pause (Space)" onclick="cmd('toggle')">▶</button>
    <button title="skip forward — past junk (→)" onclick="cmd('next')">⏭</button>
    <button title="stop" onclick="cmd('stop')">■</button>
    <button class="spd" onclick="nudge(-0.1)">‹ slower</button>
    <button class="spd" onclick="nudge(0.1)">faster ›</button>
    <select id="voice" title="voice"></select>
   </div>
  </div>
 </div>
</div>

<script type="module">
import * as pdfjsLib from '/lib/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/lib/pdf.worker.mjs';
const $ = s => document.querySelector(s);
const app=$('#app'), pdfWrap=$('#pdf'), pdfPane=$('#pdfScroll'), readPane=$('#read'), divider=$('#divider');

/* ---------- normalization (shared by highlight + select-to-read) ---------- */
const PUA={'\uF000':'ff','\uF001':'fi','\uF002':'fl','\uF003':'ffi','\uF004':'ffl'};
function normStr(s){
  s=s.replace(/[\uF000-\uF004]/g,m=>PUA[m]).normalize('NFKC').toLowerCase();
  let o=''; for(const c of s) if(/[a-z0-9]/.test(c)) o+=c; return o;
}

/* ---------- playing indicator (find the noisy tab) ---------- */
let favEl=document.querySelector('link[rel=icon]'), favState=null;
function setPlaying(on){
  document.title=(on?'▶ ':'')+'Spit It Out';
  if(favState===on) return; favState=on;
  const col=on?'#3a6df0':'#8b8b98';
  const wave=on
    ? `<path d="M15 8.5a5 5 0 010 7" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`
    : `<line x1="15" y1="9" x2="21" y2="15" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="${col}"/>${wave}</svg>`;
  favEl.href='data:image/svg+xml,'+encodeURIComponent(svg);
}

/* ---------- floating controls (Document Picture-in-Picture) ---------- */
let pipWin=null, pipEls=null;
async function popOut(){
  if(pipWin){ pipWin.close(); return; }
  if(!window.documentPictureInPicture){ alert('Floating controls need Chrome 116+ (Document Picture-in-Picture).'); return; }
  pipWin=await documentPictureInPicture.requestWindow({width:380,height:170});
  const d=pipWin.document;
  const st=d.createElement('style');
  st.textContent=`body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif;background:#15151a;color:#eaeaf0;
    display:flex;flex-direction:column;gap:10px;padding:14px;height:100vh;box-sizing:border-box}
    #pcur{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px}
    #pmeta{text-align:center;font-size:12px;color:#8b8b98}
    #prow{display:flex;gap:8px;justify-content:center}
    button{font-size:18px;background:#26262e;color:#eaeaf0;border:0;border-radius:9px;padding:9px 13px;cursor:pointer;line-height:1}
    button:hover{background:#33333d}#pplay{background:#3a6df0}`;
  d.head.appendChild(st);
  d.body.innerHTML=`<div id="pcur">…</div><div id="pmeta"></div>
    <div id="prow"><button id="pprev" title="back">⏮</button><button id="pplay" title="play/pause">▶</button>
    <button id="pnext" title="skip forward">⏭</button><button id="pstop" title="stop">■</button></div>`;
  const g=id=>d.getElementById(id);
  g('pprev').onclick=()=>cmd('prev'); g('pplay').onclick=()=>cmd('toggle');
  g('pnext').onclick=()=>cmd('next'); g('pstop').onclick=()=>cmd('stop');
  pipEls={cur:g('pcur'), play:g('pplay'), meta:g('pmeta')};
  $('#t-pip').classList.add('on');
  pipWin.addEventListener('pagehide',()=>{ pipWin=null; pipEls=null; $('#t-pip').classList.remove('on'); });
  poll();
}

/* ---------- transport + teleprompter ---------- */
let speed=1.0, lastIndex=-1, sentences=[], pageOf=[];
window.cmd = async c => { try{ render(await (await fetch('/'+c,{method:'POST'})).json()); }catch(e){} };
window.nudge = v => { speed=Math.max(0.5,Math.min(2,Math.round((speed+v)*10)/10)); fetch('/speed?v='+speed,{method:'POST'}).catch(()=>{}); };
window.seekTo = i => fetch('/seek_to?index='+i,{method:'POST'}).then(r=>r.json()).then(render).catch(()=>{});
function txt(i){ return (i>=0 && i<sentences.length) ? sentences[i] : ''; }
function render(s){
  speed=s.speed; setPlaying(s.playing);
  if(pipEls){ pipEls.cur.textContent=s.sentence||'…'; pipEls.play.textContent=s.playing?'⏸':'▶';
    pipEls.meta.textContent=s.total?`${s.index+1} / ${s.total}`:''; }
  $('#play').textContent=s.playing?'⏸':'▶';
  $('#cur').textContent=s.sentence||'(nothing loaded)';
  $('#prev').textContent=txt(s.index-1);
  $('#next').textContent=txt(s.index+1);
  $('#meta').textContent=s.total?`${s.index+1} / ${s.total} · ${s.speed.toFixed(1)}×`:'';
  const vsel=$('#voice'); if(vsel && s.voice && vsel.value!==s.voice && vsel.options.length) vsel.value=s.voice;
  $('#prog>div').style.width=s.total?((s.index+1)/s.total*100)+'%':'0';
  if(s.total && s.index!==lastIndex){ lastIndex=s.index; syncHighlight(s.index, s.sentence); }
}
$('#prev').onclick=()=>{ if(lastIndex>0) seekTo(lastIndex-1); };
$('#next').onclick=()=>{ if(lastIndex<sentences.length-1) seekTo(lastIndex+1); };
$('#prog').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect();
  seekTo(Math.min(sentences.length-1, Math.floor((e.clientX-r.left)/r.width*sentences.length))); };
async function poll(){ try{ render(await (await fetch('/status')).json()); }catch(e){} }
setInterval(poll,500);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='BUTTON') return;
  if(e.key===' '){e.preventDefault();cmd('toggle');}
  else if(e.key==='ArrowRight')cmd('next');
  else if(e.key==='ArrowLeft')cmd('prev');
  else if(e.key==='ArrowUp'){e.preventDefault();nudge(0.1);}
  else if(e.key==='ArrowDown'){e.preventDefault();nudge(-0.1);}
});

/* ---------- layout + zoom (persisted) ---------- */
const LS='pdfreader.layout';
let layout=Object.assign({orient:'row',split:60,show:'both',readScale:1},JSON.parse(localStorage.getItem(LS)||'{}'));
function saveLayout(){ localStorage.setItem(LS,JSON.stringify(layout)); }
function applyLayout(){
  app.classList.toggle('col',layout.orient==='col');
  $('#t-orient').textContent=(layout.orient==='row'?'◧':'⬓')+' Layout';
  const showPdf=layout.show!=='read', showRead=layout.show!=='pdf';
  pdfWrap.classList.toggle('hidden',!showPdf);
  readPane.classList.toggle('hidden',!showRead);
  divider.classList.toggle('hidden',!(showPdf&&showRead));
  $('#t-pdf').classList.toggle('on',showPdf);
  $('#t-read').classList.toggle('on',showRead);
  pdfWrap.style.flex = (showPdf&&showRead) ? `0 0 ${layout.split}%` : '1 1 auto';
  readPane.style.flex='1 1 auto';
  readPane.style.setProperty('--read-scale',layout.readScale);
  saveLayout();
}
$('#t-orient').onclick=()=>{layout.orient=layout.orient==='row'?'col':'row';applyLayout();};
$('#t-pdf').onclick=()=>{layout.show=(layout.show==='read')?'both':'read';applyLayout();};
$('#t-read').onclick=()=>{layout.show=(layout.show==='pdf')?'both':'pdf';applyLayout();};
$('#t-pip').onclick=popOut;
window.zoomText=d=>{ layout.readScale=Math.max(0.7,Math.min(2.4,Math.round((layout.readScale+d*0.1)*10)/10));
  readPane.style.setProperty('--read-scale',layout.readScale); saveLayout(); };
divider.addEventListener('pointerdown',e=>{
  divider.setPointerCapture(e.pointerId);
  const move=ev=>{ const r=app.getBoundingClientRect();
    const pct=layout.orient==='col'?(ev.clientY-r.top)/r.height*100:(ev.clientX-r.left)/r.width*100;
    layout.split=Math.max(15,Math.min(85,pct)); pdfWrap.style.flex=`0 0 ${layout.split}%`; };
  const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); saveLayout(); };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
});
applyLayout();

/* ---------- PDF: lazy render, precise sync-highlight, select-to-read ---------- */
let recs=[], baseFit=1, fit=1, pdfZoom=1, baseVp=null, normS='', mapS=[], pdfDoc=null;
const clampFit=x=>Math.max(0.5,Math.min(3,x));
// Deterministic geometry-based visibility (IntersectionObserver mis-reports
// bulk-appended nodes as all-visible at init). Render pages within ~1000px of
// the viewport, free the rest, so a big PDF stays light.
function updateVisible(){
  const lo=pdfPane.scrollTop-1000, hi=pdfPane.scrollTop+pdfPane.clientHeight+1000;
  for(const rec of recs){
    const y=rec.holder.offsetTop, y2=y+rec.holder.offsetHeight;
    if(y2>lo && y<hi) renderPage(rec); else freePage(rec);
  }
}
let visTick=false;
function scheduleVisible(){ if(visTick) return; visTick=true;
  requestAnimationFrame(()=>{ visTick=false; updateVisible(); }); }
pdfPane.addEventListener('scroll',scheduleVisible);
window.addEventListener('resize',scheduleVisible);

function renderPage(rec){
  if(rec.p) return rec.p;
  const token={}; rec.token=token;               // cancel guard against free-during-render
  rec.p=(async()=>{
    if(!rec.page) rec.page=await pdfDoc.getPage(rec.n);
    if(rec.token!==token) return;
    const vp=rec.page.getViewport({scale:fit});
    rec.holder.style.width=vp.width+'px'; rec.holder.style.height=vp.height+'px';
    rec.holder.style.setProperty('--scale-factor',fit);
    const dpr=window.devicePixelRatio||1;
    const cv=rec.holder.querySelector('canvas');
    cv.width=Math.floor(vp.width*dpr); cv.height=Math.floor(vp.height*dpr);
    cv.style.width=vp.width+'px'; cv.style.height=vp.height+'px';
    rec.task=rec.page.render({canvasContext:cv.getContext('2d'),
      transform:dpr!==1?[dpr,0,0,dpr,0,0]:null, viewport:vp});
    try{ await rec.task.promise; }catch(e){ return; }   // cancelled while scrolling past
    if(rec.token!==token) return;
    const tl=rec.holder.querySelector('.textLayer'); tl.replaceChildren();
    await pdfjsLib.renderTextLayer({textContentSource:rec.page.streamTextContent(),container:tl,viewport:vp}).promise;
    if(rec.token!==token) return;
    // map each normalized char to its exact DOM position (node + offset) so the
    // highlight paints a sub-line Range, not whole spans.
    rec.norm=''; rec.pos=[];
    for(const sp of tl.querySelectorAll('span')){
      if(sp.childElementCount||!sp.firstChild) continue;
      const node=sp.firstChild, raw=sp.textContent; let ri=0;
      for(const ch of raw){ for(const nc of normStr(ch)){ rec.norm+=nc; rec.pos.push({node,off:ri}); } ri+=ch.length; }
    }
    rec.ready=true;
  })();
  return rec.p;
}
function freePage(rec){
  if(!rec.p) return;
  rec.token=null;                                // stop any in-flight render from redrawing
  if(rec.task){ try{ rec.task.cancel(); }catch(e){} rec.task=null; }
  rec.p=null; rec.ready=false;
  const cv=rec.holder.querySelector('canvas'); cv.width=0; cv.height=0;
  rec.holder.querySelector('.textLayer').replaceChildren();
  rec.norm=''; rec.pos=[];
  if(rec.page&&rec.page.cleanup){ try{ rec.page.cleanup(); }catch(e){} }  // release pdf.js page internals
  rec.page=null;   // re-fetched cheaply from pdf.js cache on next render
}
async function syncHighlight(index, sentence){
  if(window.CSS && CSS.highlights) CSS.highlights.delete('sentence');  // clear first so a failed locate never leaves the old sentence lit
  const pg=pageOf[index]; const rec=pg&&recs[pg-1]; if(!rec) return;
  await renderPage(rec);
  const q=normStr(sentence); if(q.length<4||!rec.norm) return;   // no match -> don't yank the view
  const head=q.slice(0,28), tail=q.slice(-28);
  const s=rec.norm.indexOf(head); if(s<0) return;
  const ep=rec.norm.indexOf(tail, s);
  const e=ep>=0 ? Math.min(rec.norm.length-1, ep+tail.length-1) : Math.min(rec.norm.length-1, s+q.length-1);
  const p0=rec.pos[s], p1=rec.pos[e];
  try{
    const range=document.createRange();
    range.setStart(p0.node,p0.off); range.setEnd(p1.node,p1.off+1);
    if(window.CSS && CSS.highlights) CSS.highlights.set('sentence', new Highlight(range));
    // follow the read gently: scroll only when the sentence is actually off-screen
    const span=p0.node.parentElement;
    if(span){ const sr=span.getBoundingClientRect(), pr=pdfPane.getBoundingClientRect();
      if(sr.top<pr.top+16 || sr.bottom>pr.bottom-16) span.scrollIntoView({block:'center',behavior:'smooth'}); }
  }catch(err){}
}

pdfPane.addEventListener('mouseup',()=>{
  const sel=(window.getSelection().toString()||'').trim();
  if(sel.length<3||!normS) return;
  const q=normStr(sel).slice(0,60); if(q.length<3) return;
  const at=normS.indexOf(q); if(at<0) return;
  seekTo(mapS[at]); window.getSelection().removeAllRanges();
});

/* ---------- zoom the PDF (buttons + ⌘/ctrl-scroll) ---------- */
function applyScale(){ fit=baseFit*pdfZoom;
  for(const rec of recs){                       // resize placeholders; re-render live ones
    rec.holder.style.width=(baseVp.width*fit)+'px'; rec.holder.style.height=(baseVp.height*fit)+'px';
    rec.holder.style.setProperty('--scale-factor',fit);
    if(rec.p){ freePage(rec); renderPage(rec); } }
  scheduleVisible(); }
window.zoomPdf=f=>{ pdfZoom=Math.max(0.4,Math.min(4,pdfZoom*f)); applyScale(); };
function refit(){ if(!pdfDoc) return;
  baseFit=clampFit((pdfPane.clientWidth-40)/baseVp.width); pdfZoom=1; applyScale(); }
window.fitPdf=refit;
pdfPane.addEventListener('wheel',e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); zoomPdf(e.deltaY<0?1.1:1/1.1); }},{passive:false});

/* ---------- voice picker (grouped by accent + gender) ---------- */
const LANG={a:'American',b:'British',e:'Spanish',f:'French',h:'Hindi',i:'Italian',j:'Japanese',p:'Portuguese',z:'Chinese'};
const FLAG={a:'\u{1F1FA}\u{1F1F8}',b:'\u{1F1EC}\u{1F1E7}',e:'\u{1F1EA}\u{1F1F8}',f:'\u{1F1EB}\u{1F1F7}',h:'\u{1F1EE}\u{1F1F3}',i:'\u{1F1EE}\u{1F1F9}',j:'\u{1F1EF}\u{1F1F5}',p:'\u{1F1E7}\u{1F1F7}',z:'\u{1F1E8}\u{1F1F3}'};
const GENDER={f:'Female',m:'Male'};
const GROUP_ORDER=['af','am','bf','bm','ef','em','ff','hf','hm','if','im','jf','jm','pf','pm','zf','zm'];
const friendly=v=>v.slice(3).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
(async function initVoices(){
  try{
    const vs=await (await fetch('/voices')).json();
    const g={}; for(const v of vs){ (g[v.slice(0,2)]||(g[v.slice(0,2)]=[])).push(v); }
    let html='';
    for(const k of GROUP_ORDER){ if(!g[k]) continue;
      html+=`<optgroup label="${FLAG[k[0]]||''} ${LANG[k[0]]||k[0]} · ${GENDER[k[1]]||''}">`
          + g[k].sort().map(v=>`<option value="${v}">${friendly(v)}</option>`).join('')
          + `</optgroup>`;
    }
    const sel=$('#voice'); sel.innerHTML=html;
    sel.onchange=()=>fetch('/voice?v='+encodeURIComponent(sel.value),{method:'POST'}).then(r=>r.json()).then(render).catch(()=>{});
  }catch(e){}
})();

(async function init(){
  try{
    const items=await (await fetch('/sentences')).json();
    pageOf=items.map(x=>x.p); sentences=items.map(x=>x.t);
    sentences.forEach((s,si)=>{ for(const ch of normStr(s)){ normS+=ch; mapS.push(si); } });
  }catch(e){}
  try{ pdfDoc=await pdfjsLib.getDocument('/pdf').promise; }
  catch(e){ pdfPane.innerHTML='<p style="color:var(--dim);margin-top:2em">No PDF to display.</p>'; poll(); return; }
  const first=await pdfDoc.getPage(1);
  baseVp=first.getViewport({scale:1});
  baseFit=clampFit((pdfPane.clientWidth-40)/baseVp.width); fit=baseFit;
  for(let n=1;n<=pdfDoc.numPages;n++){
    const holder=document.createElement('div');
    holder.className='page'; holder.dataset.i=recs.length;
    holder.style.width=(baseVp.width*fit)+'px'; holder.style.height=(baseVp.height*fit)+'px';
    holder.style.setProperty('--scale-factor',fit);
    holder.innerHTML='<canvas width="0" height="0"></canvas><div class="textLayer"></div>';
    pdfPane.appendChild(holder);
    recs.push({n, page:(n===1?first:null), holder, p:null, ready:false, norm:'', pos:[]});
  }
  requestAnimationFrame(updateVisible);   // render only the on-screen pages once laid out
  poll();
})();
</script>
</body></html>
