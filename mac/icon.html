<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}#c{width:1024px;height:1024px}</style>
<!-- Source for mac/icon.png. Geometry follows the macOS app-icon grid: a rounded
     square inset from the 1024 canvas (so it floats) with a ~22% corner radius.
     Export mac/icon.png WITH TRANSPARENCY (the corners must be alpha 0, not white)
     by drawing this <svg> to a canvas and toDataURL('image/png') — a plain page
     screenshot bakes a white background. setup-app.sh then builds the .icns. -->
<div id="c">
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#1fb877"/><stop offset="1" stop-color="#0c8a55"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
   <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000" flood-opacity="0.18"/>
  </filter>
 </defs>
 <rect x="112" y="112" width="800" height="800" rx="184" fill="url(#bg)"/>
 <!-- speech bubble = spoken words -->
 <g filter="url(#sh)">
  <path fill="#fff" d="M320 268h384c42 0 76 34 76 76v226c0 42-34 76-76 76H524l-107 94c-14 12-36 3-36-17v-77h-56c-42 0-76-34-76-76V344c0-42 34-76 76-76z"/>
 </g>
 <!-- audio waveform inside the bubble -->
 <g fill="#12a367">
  <rect x="372" y="432" width="38" height="56" rx="19"/>
  <rect x="438" y="390" width="38" height="140" rx="19"/>
  <rect x="504" y="360" width="38" height="200" rx="19"/>
  <rect x="570" y="404" width="38" height="112" rx="19"/>
  <rect x="636" y="438" width="38" height="44" rx="19"/>
 </g>
</svg>
</div>
